server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nursery_app?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: wangyang@0205
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  type-aliases-package: com.nursery.module.**.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: nursery-jwt-secret-key-2025
  expiration: 2592000

minio:
  endpoint: http://localhost:9000  # MinIO 服务地址
  access-key: minioadmin           # 默认账号
  secret-key: minioadmin           # 默认密码
  bucket-name: nurseryapp         # 存储桶名称（相当于文件夹）

upload:
  path: ./uploads/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
